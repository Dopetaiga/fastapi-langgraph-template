[project]
name = "fastapi-langgraph-template"
version = "0.1.0"
description = "Reference-quality Agent Runtime Starter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "litellm>=1.52.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-instrumentation-httpx>=0.57b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
    "pgvector>=0.4,<1",
    "mem0ai>=1,<2",
    "mcp>=1,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real infrastructure",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
app = "app.main:app"
agent-worker = "app.runtime.worker_main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
# TODO(tech-debt): restore `strict = true` once the 134 pre-existing errors are
# resolved; see docs/CODE_REVIEW_FINDINGS.md section B2.
strict = false
