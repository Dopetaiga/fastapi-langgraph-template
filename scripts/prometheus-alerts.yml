groups:
  - name: agent-runtime
    rules:
      - alert: AgentRuntimeHighErrorRatio
        expr: sum(rate(agent_runtime_operation_count_total{status="error"}[5m])) / clamp_min(sum(rate(agent_runtime_operation_count_total[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Agent Runtime error ratio exceeds 5%
      - alert: AgentRuntimeWorkerFailures
        expr: increase(agent_runtime_worker_jobs_total{status="failed"}[10m]) > 2
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Worker jobs are repeatedly failing
      - alert: AgentRuntimeLLMCostSpike
        expr: increase(gen_ai_client_cost_USD_total[1h]) > 10
        labels: { severity: warning }
        annotations:
          summary: LLM cost exceeded 10 USD in one hour
